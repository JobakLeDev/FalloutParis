<!DOCTYPE html>
<html>
<head>
  <title>Charger POIs dans Firebase</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
    button { background: #0f0; color: #000; padding: 10px 20px; border: none; cursor: pointer; font-size: 14px; }
    button:hover { background: #0a0; }
    #log { margin-top: 20px; padding: 10px; background: #222; border: 1px solid #0f0; height: 400px; overflow-y: auto; }
    .ok { color: #0f0; }
    .err { color: #f00; }
  </style>
</head>
<body>

<h2>📡 Charger poi.geojson dans Firebase</h2>
<p>Clique le bouton pour charger les POIs depuis map/poi.geojson vers /carte/data.pois</p>

<button onclick="loadPOIs()">▶ Charger les POIs</button>

<div id="log"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC1-cP6zKVfkXdCvJHUW5OZ0m-fCQhfSVI",
  authDomain: "fallout-paris.firebaseapp.com",
  projectId: "fallout-paris",
  storageBucket: "fallout-paris.appspot.com",
  messagingSenderId: "835934395903",
  appId: "1:835934395903:web:ba10847eef67fd3c7ec5e2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function log(msg, type = 'ok') {
  const el = document.getElementById('log');
  const span = document.createElement('div');
  span.className = type;
  span.textContent = msg;
  el.appendChild(span);
  el.scrollTop = el.scrollHeight;
}

async function loadPOIs() {
  log('⏳ Chargement map/poi.geojson...', 'ok');

  try {
    const response = await fetch('map/poi.geojson');
    if (!response.ok) throw new Error('Impossible de lire poi.geojson: ' + response.status);

    const geojson = await response.json();
    log(`✓ ${geojson.features.length} features lues`, 'ok');

    // Transformer en array simple
    const pois = geojson.features.map((feature, idx) => {
      const props = feature.properties;
      const coords = feature.geometry.coordinates;
      return {
        id: props.id || idx,
        nom: props.nom_jeu,
        type: 'other', // Sera défini par MJ
        lng: coords[0],
        lat: coords[1],
        revealedFor: [], // Vide au départ
        icon: 'pin' // Sera défini par MJ
      };
    });

    log('Exemple POI:', 'ok');
    log(JSON.stringify(pois[0], null, 2), 'ok');

    log('⏳ Écriture dans Firebase /carte/data...', 'ok');
    await db.collection('carte').doc('data').set({ pois }, { merge: true });
    log('✓ POIs écrits dans /carte/data', 'ok');

    log('⏳ Vérification des campagnes...', 'ok');
    const snap = await db.collection('carte').doc('data').get();
    const data = snap.data();
    log(`✓ /carte/data contient maintenant ${data.pois.length} POIs`, 'ok');

    log('✅ SUCCÈS! POIs chargés dans Firebase', 'ok');
  } catch (err) {
    log(`❌ Erreur: ${err.message}`, 'err');
    console.error(err);
  }
}
</script>

</body>
</html>
